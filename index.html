:root{
  --bg-top:#120E33; --bg-mid:#2A1F6B; --bg-bot:#7A3C9E;
  --gold:#FFC928; --gold-d:#D99500; --red:#E52521; --ink:#1a1208; --cream:#FFF7E6;
  --pixel:'PixelFont',monospace;
  --disp:'DispFont','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  --bevel: inset 4px 4px 0 rgba(255,255,255,.55), inset -5px -5px 0 rgba(0,0,0,.28);
  --s:1;
}
body.day{ --bg-top:#5AA2FA; --bg-mid:#6FB1FC; --bg-bot:#A9D4FF; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
html,body{margin:0; height:100%; width:100%; overflow:hidden}
body{font-family:var(--body); color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%);
  transition:background .6s}

/* ---------- sky ---------- */
.sky{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.star{position:absolute; background:#FFF6C8; animation:twinkle 2.4s ease-in-out infinite; transition:opacity .6s}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
body.day .star{opacity:0 !important; animation:none}
.moon{position:absolute; top:7%; left:43%; width:90px; height:90px; border-radius:50%;
  background:#FFF3B0; box-shadow:0 0 40px 10px rgba(255,236,150,.45), inset -14px -10px 0 #F2D86A; transition:all .6s}
.moon::before,.moon::after{content:""; position:absolute; border-radius:50%; background:rgba(214,186,80,.55)}
.moon::before{width:18px;height:18px; top:24px; left:22px}
.moon::after{width:12px;height:12px; top:54px; left:48px}
body.day .moon{background:#FFE14D; box-shadow:0 0 0 10px rgba(255,236,120,.45),0 0 60px 20px rgba(255,236,120,.5)}
body.day .moon::before,body.day .moon::after{opacity:0}
.cloud{position:absolute; width:120px; height:42px; background:#fff; border-radius:24px; opacity:.16;
  animation:drift 40s linear infinite; transition:opacity .6s}
.cloud::before,.cloud::after{content:""; position:absolute; background:inherit; border-radius:50%}
.cloud::before{width:46%;height:120%; top:-55%; left:15%}
.cloud::after{width:32%;height:90%; top:-40%; left:52%}
body.day .cloud{opacity:.95}
@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}

.ground{position:fixed; left:0; right:0; bottom:0; height:calc(56px*var(--s)); z-index:1;
  background:linear-gradient(180deg,#E89F4A 0 18%,#C9772B 18% 100%); border-top:calc(5px*var(--s)) solid var(--ink)}
.ground::after{content:""; position:absolute; inset:6px 0 0 0;
  background-image:linear-gradient(90deg, rgba(0,0,0,.25) 2px, transparent 2px),linear-gradient(rgba(0,0,0,.18) 2px, transparent 2px);
  background-size:calc(44px*var(--s)) calc(44px*var(--s)), calc(44px*var(--s)) calc(22px*var(--s))}

/* ---------- stage (fixed 1600x900, scaled to fit) ---------- */
#stage{position:absolute; left:50%; top:50%; width:1600px; height:900px; z-index:3;
  transform:translate(-50%,-50%) scale(var(--s))}
.shaker{position:absolute; inset:0}
.shaker.shake{animation:shake .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-4px,2px)} 20%,80%{transform:translate(8px,-4px)}
  30%,50%,70%{transform:translate(-14px,6px)} 40%,60%{transform:translate(14px,-6px)}}

.outline{text-shadow:
  4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),
  4px 4px var(--ink),-4px 4px var(--ink),4px -4px var(--ink),-4px -4px var(--ink),7px 9px 0 rgba(0,0,0,.35)}

.left{position:absolute; left:70px; top:58px; width:590px}
.tag-en{font-family:var(--pixel); font-size:15px; color:#FFE07A; letter-spacing:2px;
  text-shadow:2px 2px 0 var(--ink)}
.title1{font-family:var(--disp); color:#fff; font-size:104px; line-height:1; margin-top:18px; letter-spacing:4px}
.title2{font-family:var(--disp); color:var(--gold); font-size:150px; line-height:1; margin-top:2px; letter-spacing:6px}
.subtitle{display:inline-block; margin-top:20px; font-family:var(--disp); color:#fff; font-size:29px; letter-spacing:2px;
  background:var(--red); border:4px solid var(--ink); padding:6px 18px; box-shadow:4px 4px 0 var(--ink)}

.legend{margin-top:26px; background:rgba(10,8,30,.45); border:5px solid var(--ink);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.18), 6px 6px 0 rgba(0,0,0,.35); padding:12px 20px; width:520px}
body.day .legend{background:rgba(20,40,110,.35)}
.lrow{display:flex; align-items:center; gap:14px; height:56px; transition:transform .2s, background .2s; padding:0 8px; margin:0 -8px}
.lrow.hit{background:rgba(255,230,120,.25); transform:scale(1.04); animation:rowblink .3s steps(2) 6}
@keyframes rowblink{50%{background:rgba(255,255,255,.45)}}
.lchip{width:30px; height:30px; border:4px solid var(--ink); box-shadow:inset 3px 3px 0 rgba(255,255,255,.4)}
.lnum{font-family:var(--pixel); font-size:28px; color:#fff; width:38px; text-shadow:3px 3px 0 var(--ink)}
.lname{font-family:var(--disp); font-size:28px; color:#fff; text-shadow:2px 2px 0 var(--ink); width:132px; letter-spacing:1px}
.lcoins{display:flex; gap:5px}
.mcoin{width:22px; height:22px; border-radius:50%; border:3px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#FFF1A0,var(--gold) 60%,var(--gold-d)); animation:flip 1.8s ease-in-out infinite}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}

.status{margin-top:22px; font-family:var(--disp); color:#fff; font-size:32px; letter-spacing:2px; min-height:42px;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),4px 4px 0 rgba(0,0,0,.3)}
.status.beat{animation:beat .45s ease}
@keyframes beat{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.hint{font-family:var(--pixel); font-size:12px; color:rgba(255,255,255,.75); margin-top:8px; letter-spacing:1px}

.topbar{position:absolute; right:30px; top:22px; display:flex; gap:12px; z-index:20}
.btn{font-family:var(--disp); cursor:pointer; border:4px solid var(--ink); color:#fff; padding:6px 16px; font-size:22px;
  letter-spacing:1px; box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.35); background:#2EA82E; transition:transform .1s}
.btn:active{transform:translate(3px,3px)}
.btn.b2{background:#6A55C8} .btn.b3{background:#8590A6}

/* ---------- wheel ---------- */
.wheel-box{position:absolute; left:730px; top:52px; width:790px; height:790px}
#wheelSvg{width:100%; height:100%; overflow:visible; cursor:pointer; display:block}
.bulb{fill:#6B5420; transition:fill .08s}
.bulb.on{fill:#FFF8CF; filter:drop-shadow(0 0 7px #FFE36B)}
.wheel-box.win .bulb.on{fill:#fff; filter:drop-shadow(0 0 12px #fff)}
#hub{transform-box:fill-box; transform-origin:center; animation:hubpulse 1.4s ease-in-out infinite; cursor:pointer}
.wheel-box.busy #hub{animation:none}
@keyframes hubpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.flash-sector{fill:#fff; opacity:0; pointer-events:none}
.flash-sector.on{animation:secflash .9s steps(2) 1}
@keyframes secflash{0%{opacity:.7}25%{opacity:0}50%{opacity:.7}75%{opacity:0}100%{opacity:0}}
.pointer{position:absolute; left:50%; top:-46px; width:96px; height:132px; z-index:5;
  transform:translateX(-50%); transform-origin:50% 36px; filter:drop-shadow(4px 6px 0 rgba(0,0,0,.35))}
.pointer.bounce{animation:pbounce .5s ease}
@keyframes pbounce{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-18px)}}

.footnote{position:absolute; left:0; right:0; bottom:12px; text-align:center; color:#fff; font-family:var(--disp);
  font-size:22px; letter-spacing:3px; text-shadow:2px 2px 0 var(--ink); z-index:4}

/* ---------- jackpot fx ---------- */
.rays{position:fixed; left:50%; top:50%; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax; z-index:2; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,214,64,.42) 0 9deg, rgba(255,214,64,0) 9deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 0 18%, transparent 46%); mask:radial-gradient(circle, #000 0 18%, transparent 46%);
  opacity:0; transition:opacity .5s; animation:spinrays 14s linear infinite}
.rays.on{opacity:1}
@keyframes spinrays{to{transform:rotate(360deg)}}
.whiteflash{position:fixed; inset:0; background:#fff; z-index:60; pointer-events:none; opacity:0}
.whiteflash.on{animation:wflash .7s ease-out}
@keyframes wflash{0%{opacity:.95}100%{opacity:0}}
.jp{position:absolute; left:0; right:0; top:250px; text-align:center; z-index:50; pointer-events:none; opacity:0}
.jp .e{font-family:var(--pixel); font-size:46px; color:#fff; letter-spacing:6px; text-shadow:5px 5px 0 var(--red), 9px 9px 0 var(--ink)}
.jp .t{font-family:var(--disp); font-size:200px; line-height:1.1; color:var(--gold); letter-spacing:10px; margin-top:20px}
.jp.on{animation:slam 2s cubic-bezier(.2,.9,.3,1) forwards}
.jp.on .t{animation:rainbow .5s linear infinite}
@keyframes slam{0%{opacity:0; transform:scale(3.2) rotate(-6deg)}14%{opacity:1; transform:scale(.92) rotate(2deg)}
  22%{transform:scale(1.06) rotate(-1deg)}30%{transform:scale(1)}78%{opacity:1; transform:scale(1)}100%{opacity:0; transform:scale(1.15)}}
@keyframes rainbow{0%{color:#FFC928}25%{color:#FF6B6B}50%{color:#5CE1FF}75%{color:#7CFF6B}100%{color:#FFC928}}

/* ---------- result card ---------- */
.result{position:absolute; inset:-200px; display:flex; align-items:center; justify-content:center; z-index:40;
  pointer-events:none; opacity:0; transition:opacity .25s; background:rgba(12,8,36,.5)}
.result.on{opacity:1; pointer-events:auto}
.card{background:var(--cream); border:6px solid var(--ink); box-shadow:var(--bevel),10px 10px 0 rgba(0,0,0,.45);
  width:720px; padding:30px 40px 34px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px;
  transform:scale(.4) translateY(40px); transition:transform .4s cubic-bezier(.34,1.6,.5,1); position:relative}
.result.on .card{transform:scale(1) translateY(0)}
.card.tierS{animation:cardglow .6s linear infinite}
@keyframes cardglow{0%{box-shadow:var(--bevel),0 0 0 8px #FFC928,0 0 60px 18px rgba(255,201,40,.7)}
  33%{box-shadow:var(--bevel),0 0 0 8px #FF6B6B,0 0 60px 18px rgba(255,107,107,.7)}
  66%{box-shadow:var(--bevel),0 0 0 8px #5CE1FF,0 0 60px 18px rgba(92,225,255,.7)}
  100%{box-shadow:var(--bevel),0 0 0 8px #FFC928,0 0 60px 18px rgba(255,201,40,.7)}}
.res-eye{font-family:var(--pixel); font-size:24px; color:#17803A; letter-spacing:3px}
.card.tierS .res-eye{color:var(--red)}
.res-coin{width:180px; height:180px; border-radius:50%; border:6px solid var(--ink); position:relative;
  background:radial-gradient(circle at 35% 30%,#FFF4B0,var(--gold) 58%,var(--gold-d));
  display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(255,201,40,.25)}
.res-coin::after{content:""; position:absolute; inset:13%; border:4px solid rgba(0,0,0,.28); border-radius:12px}
.res-coin.pop{animation:cpop .22s ease}
@keyframes cpop{50%{transform:scale(1.15) rotate(-6deg)}}
.res-coin span{font-family:var(--pixel); font-size:80px; color:#fff; position:relative; z-index:2;
  text-shadow:5px 0 var(--ink),-5px 0 var(--ink),0 5px var(--ink),0 -5px var(--ink),5px 5px var(--ink),-5px -5px var(--ink),5px -5px var(--ink),-5px 5px var(--ink)}
.res-coins{display:flex; gap:12px; height:52px; align-items:center}
.res-coins .c{width:46px; height:46px; border-radius:50%; border:4px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#FFF1A0,var(--gold) 60%,var(--gold-d)); opacity:.18; transform:scale(.7)}
.res-coins .c.got{opacity:1; animation:cgot .35s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes cgot{0%{transform:translateY(-60px) scale(.6)}100%{transform:translateY(0) scale(1)}}
.res-title{font-family:var(--disp); font-size:58px; letter-spacing:2px; color:#E07B00; text-shadow:3px 3px 0 rgba(0,0,0,.15)}
.res-sub{font-weight:800; color:#5a4a30; font-size:26px}
.btn-go{font-family:var(--disp); background:var(--red); font-size:34px; padding:10px 36px; margin-top:6px;
  border:4px solid var(--ink); color:#fff; cursor:pointer; box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.35); letter-spacing:3px}
.btn-go:active{transform:translate(3px,3px)}

canvas#fx{position:fixed; inset:0; pointer-events:none; z-index:55}

@media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important; transition-duration:.15s !important}}
</style>

<script>
/* =====================================================
   华特听写满分大转盘 · 优化版

/* ---------- 数据 ---------- */
const PRIZES = {
  5:{name:'超级大奖', color:'#FFC928', dark:'#C98A00'},
  4:{name:'一等奖',   color:'#EE3B3B', dark:'#A81E22'},
  3:{name:'二等奖',   color:'#2DBE55', dark:'#17803A'},
  2:{name:'三等奖',   color:'#2E86F0', dark:'#1B57A8'},

// 转盘上 5 个等分扇区（从顶部顺时针）
const SECTORS = [
  {coins:2, start:0},  {coins:5, start:72}, {coins:1, start:144},
  {coins:4, start:216},{coins:3, start:288},
];
const WEIGHTS = {5:10, 4:10, 3:10, 2:35, 1:35};
function weightedPickCoins(){
  const total = Object.values(WEIGHTS).reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(const k of Object.keys(WEIGHTS)){ if(r < WEIGHTS[k]) return parseInt(k); r -= WEIGHTS[k]; }
  return 1;
}

    <div class="lname">${p.name}</div><div class="lcoins">${Array.from({length:n},(_,i)=>`<div class="mcoin" style="animation-delay:${-(n*0.37+i*0.23)}s"></div>`).join('')}</div>`;

/* ---------- 画转盘（SVG） ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('wheelSvg');
const R = 318;            // 扇区半径
const RIM_OUT = 388, RIM_IN = 322, BULB_R = 355, NBULB = 30;
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);

}
function pt(deg, r){ const a = deg*Math.PI/180; return [r*Math.sin(a), -r*Math.cos(a)]; }
function sectorPath(a0, a1, r){
  const [x0,y0] = pt(a0,r), [x1,y1] = pt(a1,r);
  return `M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
function buildWheel(){
  const defs = el('defs', {}, svg);

    <pattern id="pBrick" width="48" height="24" patternUnits="userSpaceOnUse">

    <pattern id="pStripe" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="22" fill="rgba(255,255,255,.14)"/></pattern>
    <pattern id="pCheck" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="rgba(0,0,0,.1)"/><rect x="14" y="14" width="14" height="14" fill="rgba(0,0,0,.1)"/></pattern>
    <radialGradient id="gGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF6B8"/><stop offset=".55" stop-color="#FFC928"/><stop offset="1" stop-color="#F09A00"/></radialGradient>
    <radialGradient id="gShade" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.28)"/></radialGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/><stop offset=".5" stop-color="#FFC928"/><stop offset="1" stop-color="#E39A00"/></linearGradient>
  `;
  const patterns = {1:'pBrick', 2:'pDots', 3:'pStripe', 4:'pCheck', 5:null};

  // 投影 + 外框
  el('circle', {cx:12, cy:16, r:RIM_OUT+4, fill:'rgba(0,0,0,.35)'}, svg);
  el('circle', {cx:0, cy:0, r:RIM_OUT, fill:'url(#gRim)', stroke:'#1a1208', 'stroke-width':9}, svg);
  el('circle', {cx:0, cy:0, r:RIM_OUT-9, fill:'none', stroke:'rgba(255,255,255,.55)', 'stroke-width':5}, svg);

  // 旋转部分
  const rotor = el('g', {id:'rotor'}, svg);
  SECTORS.forEach(s=>{
    const p = PRIZES[s.coins], d = sectorPath(s.start, s.start+72, R);
    el('path', {d, fill: s.coins===5 ? 'url(#gGold)' : p.color}, rotor);
    if(patterns[s.coins]) el('path', {d, fill:`url(#${patterns[s.coins]})`}, rotor);
    if(s.coins===5){ // 超级大奖扇区加星星
      [[0,-290,14],[-50,-215,9],[52,-222,11],[-30,-118,8],[34,-112,8]].forEach(([x,y,r],i)=>{
        const g = el('g',{transform:`rotate(${s.start+36}) translate(${x} ${y})`}, rotor);
        el('path',{d:starPath(r), fill:'#fff', opacity:.85}, g);
      });
    }
  });
  el('circle', {cx:0, cy:0, r:R, fill:'url(#gShade)'}, rotor);
  SECTORS.forEach(s=>{
    const [x,y] = pt(s.start, R);

  // 中奖闪光层
  SECTORS.forEach(s=>{
    el('path', {d:sectorPath(s.start, s.start+72, R), class:'flash-sector', id:'flash'+s.coins}, rotor);
  });
  // 文字与金币
  SECTORS.forEach(s=>{
    const g = el('g', {transform:`rotate(${s.start+36})`}, rotor);
    const num = el('text', {x:0, y:-212, 'text-anchor':'middle', 'font-family':'PixelFont', 'font-size':84,
      fill:'#fff', stroke:'#1a1208', 'stroke-width':12, 'paint-order':'stroke', 'stroke-linejoin':'round'}, g);
    num.textContent = s.coins;
    const lab = el('text', {x:0, y:-160, 'text-anchor':'middle', 'font-family':'DispFont, Microsoft YaHei', 'font-size':38,
      fill:'#fff', stroke:'#1a1208', 'stroke-width':9, 'paint-order':'stroke', 'stroke-linejoin':'round', 'letter-spacing':2}, g);
    lab.textContent = '枚华特币';
    const n = s.coins, gap = 32, cy = -112, w = (n-1)*gap;
    for(let i=0;i<n;i++){
      const cx = -w/2 + i*gap;
      el('circle', {cx, cy, r:13, fill:'#FFC928', stroke:'#1a1208', 'stroke-width':4}, g);
      el('rect', {x:cx-3, y:cy-7, width:6, height:14, fill:'rgba(0,0,0,.28)'}, g);
    }
  });
  el('circle', {cx:0, cy:0, r:R, fill:'none', stroke:'#1a1208', 'stroke-width':9}, svg);

  // 跑马灯
  const bulbs = el('g', {id:'bulbs'}, svg);
  for(let i=0;i<NBULB;i++){
    const [x,y] = pt(i*360/NBULB, BULB_R);
    el('circle', {cx:x, cy:y, r:10, class:'bulb', stroke:'#1a1208', 'stroke-width':4}, bulbs);
  }

  // 中心 GO 按钮
  const hub = el('g', {id:'hub'}, svg);
  el('rect', {x:-70, y:-70, width:140, height:140, rx:16, fill:'#FFC928', stroke:'#1a1208', 'stroke-width':8}, hub);
  el('path', {d:'M-58 54 V-58 H54', fill:'none', stroke:'rgba(255,255,255,.65)', 'stroke-width':7}, hub);
  el('path', {d:'M-54 58 H58 V-54', fill:'none', stroke:'rgba(0,0,0,.25)', 'stroke-width':7}, hub);
  [[-48,-48],[48,-48],[-48,48],[48,48]].forEach(([x,y])=>el('rect',{x:x-5,y:y-5,width:10,height:10,fill:'#1a1208'},hub));
  const go = el('text', {x:2, y:20, 'text-anchor':'middle', 'font-family':'PixelFont', 'font-size':44, fill:'#fff',
    stroke:'#1a1208', 'stroke-width':9, 'paint-order':'stroke'}, hub);
  go.textContent = 'GO';
}
function starPath(r){
  let d=''; for(let i=0;i<10;i++){ const rr = i%2? r*.45 : r, a = i*Math.PI/5;
    d += (i?'L':'M') + (rr*Math.sin(a)).toFixed(1)+' '+(-rr*Math.cos(a)).toFixed(1); }
  return d+'Z';
}
buildWheel();
const rotor = document.getElementById('rotor');
const bulbEls = [...document.querySelectorAll('.bulb')];

/* ---------- 跑马灯 ---------- */
let bulbMode = 'idle', bulbStep = 0, bulbTimer = null;
function setBulbs(mode){
  bulbMode = mode; clearInterval(bulbTimer);
  const speed = {idle:420, spin:55, win:130}[mode];
  bulbTimer = setInterval(()=>{
    bulbStep++;
    bulbEls.forEach((b,i)=>{
      let on;
      if(mode==='idle') on = (i + bulbStep) % 2 === 0;
      else if(mode==='spin') on = (i + bulbStep) % 5 < 2;
      else on = bulbStep % 2 === 0;
      b.classList.toggle('on', on);
    });
  }, speed);
}
setBulbs('idle');

/* =====================================================
   音效（纯 WebAudio 合成，离线可用）
   ===================================================== */
let soundOn = true, actx = null, master = null;
function ac(){
  if(!actx){
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      master = actx.createGain(); master.gain.value = .9;
      master.connect(comp); comp.connect(actx.destination);
    }catch(e){ return null; }
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, t0, dur, o={}){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const {type='square', vol=.14, slideTo=null, attack=.004} = o;
  const osc = c.createOscillator(), g = c.createGain();
  const st = c.currentTime + t0;
  osc.type = type; osc.frequency.setValueAtTime(freq, st);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, st+dur);
  g.gain.setValueAtTime(.0001, st);
  g.gain.linearRampToValueAtTime(vol, st+attack);
  g.gain.setValueAtTime(vol, st + Math.max(attack, dur*.55));
  g.gain.exponentialRampToValueAtTime(.0001, st+dur);
  osc.connect(g); g.connect(master); osc.start(st); osc.stop(st+dur+.03);
}
function noise(t0, dur, vol=.3, f0=2400, f1=200){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const len = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type='lowpass';
  const st = c.currentTime + t0;
  f.frequency.setValueAtTime(f0, st); f.frequency.exponentialRampToValueAtTime(f1, st+dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, st); g.gain.exponentialRampToValueAtTime(.0001, st+dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(st); src.stop(st+dur);
}
const NOTE = n => 440*Math.pow(2,(n-69)/12);   // MIDI → Hz
const SFX = {
  tick(){ tone(1500,0,.025,{vol:.06}); tone(700,0,.035,{type:'triangle',vol:.1}); },
  // 吃金币：叮—叮！
  coin(p=1, v=.15){ tone(988*p,0,.08,{vol:v}); tone(1319*p,.075,.38,{vol:v}); },
  // 起跳：转盘启动
  start(){ tone(250,0,.24,{slideTo:1000,vol:.13}); tone(125,0,.24,{type:'triangle',slideTo:500,vol:.14}); noise(0,.12,.12,3000,600); },
  click(){ tone(880,0,.05,{vol:.07}); tone(1320,.04,.06,{vol:.06}); },
  // 1~2 枚：小小庆祝
  small(){
    SFX.coin();
    [72,76,79,84].forEach((m,i)=>tone(NOTE(m),.45+i*.07,i===3?.32:.1,{vol:.11}));
    tone(NOTE(48),.45,.5,{type:'triangle',vol:.14});
  },
  // 3~4 枚：过关小号
  mid(){
    SFX.coin();
    const t = .4;
    [[60,0],[64,.08],[67,.16],[72,.24]].forEach(([m,d])=>tone(NOTE(m),t+d,.09,{vol:.13}));
    [[67,.46,.13],[69,.6,.13],[71,.74,.13],[72,.88,.7]].forEach(([m,d,l])=>tone(NOTE(m),t+d,l,{vol:.14}));
    [[64,.46,.13],[65,.6,.13],[67,.74,.13],[64,.88,.7]].forEach(([m,d,l])=>tone(NOTE(m),t+d,l,{type:'triangle',vol:.12}));
    [[36,0,.4],[43,.46,.4],[48,.88,.75]].forEach(([m,d,l])=>tone(NOTE(m),t+d,l,{type:'triangle',vol:.16}));
    [96,100,103,108].forEach((m,i)=>tone(NOTE(m),t+.95+i*.07,.1,{vol:.05}));
  },
  // 5 枚：超级大奖
  jackpot(){
    noise(0,.6,.45,1800,80); tone(110,0,.5,{type:'triangle',slideTo:40,vol:.3});
    // 变身闪光音（快速上行音阶）
    const scale=[60,62,64,65,67,69,71,72,74,76,77,79,81,83,84,86,88,91];
    scale.forEach((m,i)=>{ tone(NOTE(m),.15+i*.04,.06,{vol:.09}); tone(NOTE(m+12),.17+i*.04,.05,{vol:.05}); });
    const t = .95;
    const chords = [[[65,69,72],0,.17],[[67,71,74],.2,.17],[[72,76,79],.42,.12],[[72,76,79],.58,.12],[[72,76,79,84],.74,1.1]];
    chords.forEach(([ns,d,l])=>ns.forEach(m=>tone(NOTE(m),t+d,l,{vol:.1})));
    for(let i=0;i<10;i++) tone(NOTE(96),t+.74+i*.1,.05,{vol:.04});   // 颤音闪光
    [[41,0,.18],[43,.2,.18],[36,.42,1.4]].forEach(([m,d,l])=>tone(NOTE(m),t+d,l,{type:'triangle',vol:.2}));
    [108,105,103,100,98,96,93,91].forEach((m,i)=>tone(NOTE(m),t+1.9+i*.06,.09,{vol:.05}));
  },
  pop(){ noise(0,.35,.28,2500,150); tone(220,0,.2,{type:'triangle',slideTo:70,vol:.12}); },
};

/* =====================================================
   特效画布：彩纸、星星、金币雨、烟花
   ===================================================== */
const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
const DPR = Math.min(window.devicePixelRatio||1, 2);
let parts = [], rafOn = false;
function groundY(){ return innerHeight - 56*parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')); }
function addPart(p){ parts.push(Object.assign({life:0, maxLife:300, rot:0, vr:0, alpha:1}, p)); if(!rafOn){ rafOn=true; requestAnimationFrame(loop); } }
const COLORS = ['#FFC928','#E52521','#2DBE55','#2E86F0','#FFFFFF','#F2822B','#B06CFF'];
function wheelCenter(){ const r = document.getElementById('wheelSvg').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2, r.width/2]; }
function confetti(x, y, n=160, power=15){
  for(let i=0;i<n;i++) addPart({type:'sq', x:x+(Math.random()-.5)*80, y, vx:(Math.random()-.5)*power, vy:-Math.random()*power-4,
    g:.4+Math.random()*.2, s:7+Math.random()*9, vr:(Math.random()-.5)*.4, c:COLORS[i%COLORS.length], maxLife:240});
}
function starBurst(x, y, n=36, sp=12){
  for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = sp*(.5+Math.random()*.7);
    addPart({type:'star', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-3, g:.22, s:12+Math.random()*12, vr:(Math.random()-.5)*.3,
      c:['#FFF6B0','#FFC928','#FFFFFF'][i%3], maxLife:120, fade:true}); }
}
function coinShower(count, spread, dur){
  const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'));
  for(let i=0;i<count;i++){
    setTimeout(()=>addPart({type:'coin', x:Math.random()*innerWidth, y:-40-Math.random()*60,
      vx:(Math.random()-.5)*2, vy:2+Math.random()*4, g:.28, s:(26+Math.random()*20)*Math.max(s,.6),
      ph:Math.random()*6, vph:.12+Math.random()*.12, bounced:false, maxLife:400}), Math.random()*dur);
  }
}
function firework(x, y){
  SFX.pop();
  const c = COLORS[Math.floor(Math.random()*COLORS.length)];
  for(let i=0;i<70;i++){ const a = i/70*Math.PI*2, v = 5+Math.random()*6;
    addPart({type:'spark', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:.08, s:5+Math.random()*4, c, maxLife:75, fade:true, drag:.97}); }
}
function drawCoin(p){
  const w = p.s*Math.abs(Math.cos(p.ph)), h = p.s;
  ctx.fillStyle = '#1a1208';
  ctx.beginPath(); ctx.ellipse(0,0,w/2+3,h/2+3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = Math.cos(p.ph) > 0 ? '#FFC928' : '#E7A400';
  ctx.beginPath(); ctx.ellipse(0,0,Math.max(w/2,1),h/2,0,0,Math.PI*2); ctx.fill();
  if(w > h*.35){
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-w*.08,-h*.28,w*.16,h*.56);
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(-w*.32,-h*.3,w*.1,h*.22);
  }
}
function drawStar(s){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const r = i%2? s*.42 : s, a = i*Math.PI/5; ctx[i?'lineTo':'moveTo'](r*Math.sin(a), -r*Math.cos(a)); }
  ctx.closePath(); ctx.fill();
}
let lastRainDing = 0;
function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const gy = groundY(), now = performance.now();
  for(const p of parts){
    p.life++; p.vy += p.g; if(p.drag){ p.vx*=p.drag; p.vy*=p.drag; }
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.type==='coin'){
      p.ph += p.vph;
      if(p.vy > 11) p.vy = 11;
      if(!p.bounced && p.y > gy - p.s/2){ p.y = gy - p.s/2; p.vy *= -.5; p.vx *= 1.5; p.bounced = true;
        if(now - lastRainDing > 140 && Math.random() < .5){ lastRainDing = now; SFX.coin(1 + Math.random()*.25, .05); } }
      if(p.bounced) p.alpha -= .035;
    }
    if(p.fade) p.alpha = 1 - p.life/p.maxLife;
  }
  parts = parts.filter(p=> p.life < p.maxLife && p.alpha > 0 && p.y < innerHeight + 80);
  for(const p of parts){
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1,p.alpha)); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
    if(p.type==='coin') drawCoin(p);
    else if(p.type==='star') drawStar(p.s);
    else ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
    ctx.restore();
  }
  if(parts.length) requestAnimationFrame(loop); else { rafOn=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* =====================================================
   转动逻辑
   ===================================================== */
const wheelBox = document.getElementById('wheelBox');
const pointer = document.getElementById('pointer');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result'), card = document.getElementById('card');
const resNum = document.getElementById('resNum'), resCoin = document.getElementById('resCoin');
const resCoins = document.getElementById('resCoins'), resTitle = document.getElementById('resTitle');
const resSub = document.getElementById('resSub'), resEye = document.getElementById('resEye');
const shaker = document.getElementById('shaker'), rays = document.getElementById('rays');
const jp = document.getElementById('jp'), wflash = document.getElementById('wflash');

let rot = 0, spinning = false, modalOpen = false, timers = [];
const SPIN_MS = 5600, EXTRA_TURNS = 7, PEG = 360/NBULB;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function setStatus(t){ statusEl.textContent = t; statusEl.classList.remove('beat'); void statusEl.offsetWidth; statusEl.classList.add('beat'); }
function flickPointer(){
  pointer.style.transition = 'none';
  pointer.style.transform = 'translateX(-50%) rotate(-22deg)';
  requestAnimationFrame(()=>{ pointer.style.transition = 'transform .2s cubic-bezier(.3,1.9,.5,1)'; pointer.style.transform = 'translateX(-50%) rotate(0deg)'; });
}
const ease = t => 1 - Math.pow(1 - t, 4);

function spin(){
  if(spinning || modalOpen) return;
  spinning = true; ac();
  wheelBox.classList.add('busy'); wheelBox.classList.remove('win');
  document.querySelectorAll('.lrow').forEach(r=>r.classList.remove('hit'));
  setBulbs('spin'); SFX.start();
  setStatus('转盘转动中，盯紧啦！👀');

  const coinsWon = weightedPickCoins();
  const sec = SECTORS.find(s => s.coins === coinsWon);
  const margin = 10;
  const a = sec.start + margin + Math.random()*(72 - margin*2);
  const curMod = ((rot % 360) + 360) % 360;
  const tgtMod = ((360 - a) % 360 + 360) % 360;
  const total = EXTRA_TURNS*360 + ((tgtMod - curMod + 360) % 360);
  const startRot = rot, t0 = performance.now();
  let lastPeg = Math.floor(startRot/PEG), lastTick = 0;

  (function frame(now){
    const t = Math.min(1, (now - t0)/SPIN_MS);
    rot = startRot + total*ease(t);
    rotor.setAttribute('transform', `rotate(${rot})`);
    const peg = Math.floor(rot/PEG);
    if(peg !== lastPeg){
      lastPeg = peg;
      if(now - lastTick > 38){ lastTick = now; SFX.tick(); flickPointer(); }
    }
    if(t < 1) requestAnimationFrame(frame); else land(coinsWon);
  })(t0);
}

function land(n){
  spinning = false;
  const tier = n >= 5 ? 'S' : n >= 3 ? 'A' : 'B';
  pointer.classList.remove('bounce'); void pointer.offsetWidth; pointer.classList.add('bounce');
  const fl = document.getElementById('flash'+n); fl.classList.remove('on'); void fl.getBBox(); fl.classList.add('on');
  wheelBox.classList.add('win'); setBulbs('win');
  document.getElementById('lrow'+n).classList.add('hit');
  setStatus(`抽中啦：${PRIZES[n].name} · ${n} 枚华特币！`);
  const [cx, cy] = wheelCenter();

  if(tier === 'S'){
    SFX.coin();
    later(()=>{
      SFX.jackpot();
      wflash.classList.remove('on'); void wflash.offsetWidth; wflash.classList.add('on');
      shaker.classList.remove('shake'); void shaker.offsetWidth; shaker.classList.add('shake');
      rays.classList.add('on');
      jp.classList.remove('on'); void jp.offsetWidth; jp.classList.add('on');
      coinShower(200, 1, 2000);
      starBurst(cx, cy, 60, 16);
      [0,500,1000,1500,2100,2700].forEach((d,i)=>later(()=>firework(innerWidth*(.15+Math.random()*.7), innerHeight*(.15+Math.random()*.35)), 900+d));
    }, 450);
    later(()=>openResult(n, tier), 2500);
  } else if(tier === 'A'){
    later(()=>{
      SFX.mid();
      starBurst(cx, cy, 40, 13);
      coinShower(60, 1, 1800);
    }, 450);
    later(()=>openResult(n, tier), 950);
  } else {
    later(()=>{ SFX.small(); confetti(cx, cy - 80, 150, 15); }, 450);
    later(()=>openResult(n, tier), 900);
  }
}

const MSG = {
  S:['今天的你就是听写之王！','满分加超级大奖，双倍快乐！','欧气爆棚！全班都来沾沾喜气～'],
  A:['太厉害啦，满分实至名归！','运气和实力都在线！','继续保持，下次冲超级大奖！'],
  B:['满分就是最棒的奖励，继续加油！','每一枚华特币都是努力换来的～','下次听写也要满分哦！'],
};
function openResult(n, tier){
  modalOpen = true;
  card.className = 'card' + (tier==='S' ? ' tierS' : '');
  resEye.textContent = {S:'★ JACKPOT ★', A:'GREAT!', B:'COIN GET!'}[tier];
  resTitle.textContent = {S:`超级大奖！${n} 枚华特币`, A:`太棒了！获得 ${n} 枚华特币`, B:`获得 ${n} 枚华特币！`}[tier];
  resSub.textContent = MSG[tier][Math.floor(Math.random()*3)];
  resNum.textContent = '0';
  resCoins.innerHTML = '<div class="c"></div>'.repeat(n);
  resultEl.classList.add('on');
  if(tier !== 'S') confetti(innerWidth/2, innerHeight*.45, 120, 14);
  const cs = [...resCoins.children];
  for(let i=1;i<=n;i++){
    later(()=>{
      resNum.textContent = i;
      resCoin.classList.remove('pop'); void resCoin.offsetWidth; resCoin.classList.add('pop');
      cs[i-1].classList.add('got');
      SFX.coin(1 + (i-1)*.06, .13);
    }, 380 + (i-1)*270);
  }
  later(()=>{ if(tier !== 'B'){ const r = resCoin.getBoundingClientRect(); starBurst(r.left+r.width/2, r.top+r.height/2, 26, 9); } }, 420 + n*270);
}
function closeResult(){
  if(!modalOpen) return;
  modalOpen = false; SFX.click();
  timers.forEach(clearTimeout); timers = [];
  resultEl.classList.remove('on'); rays.classList.remove('on');
  wheelBox.classList.remove('busy','win'); setBulbs('idle');
  document.querySelectorAll('.lrow').forEach(r=>r.classList.remove('hit'));
  setStatus('点击转盘，开始抽取华特币奖励！');
}

svg.addEventListener('click', spin);
document.getElementById('againBtn').addEventListener('click', closeResult);
addEventListener('keydown', e=>{
  if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); modalOpen ? closeResult() : spin(); }
});

/* ---------- 按钮 ---------- */
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', ()=>{ soundOn = !soundOn; soundBtn.textContent = soundOn ? '🔊 声音' : '🔇 静音'; if(soundOn) SFX.coin(); });
const themeBtn = document.getElementById('themeBtn');
function applyTheme(day){ document.body.classList.toggle('day', day); themeBtn.textContent = day ? '🌙 夜晚' : '☀️ 白天'; }
try{ applyTheme(localStorage.getItem('walt-wheel-theme') === 'day'); }catch(e){}
themeBtn.addEventListener('click', ()=>{ const day = !document.body.classList.contains('day'); applyTheme(day); SFX.click();
  try{ localStorage.setItem('walt-wheel-theme', day ? 'day' : 'night'); }catch(e){} });
const fsBtn = document.getElementById('fsBtn');
fsBtn.addEventListener('click', ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});
document.addEventListener('fullscreenchange', ()=>{ fsBtn.textContent = document.fullscreenElement ? '⛶ 退出全屏' : '⛶ 全屏'; });

addEventListener('resize', fit); fit();
</script>

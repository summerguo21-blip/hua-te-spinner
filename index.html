:root{
  --bg-top:#120E33; --bg-mid:#2A1F6B; --bg-bot:#7A3C9E;
  --gold:#FFC928; --gold-d:#D99500; --red:#E52521; --ink:#1a1208; --cream:#FFF7E6;
  --pixel:'PixelFont',monospace;
  --disp:'DispFont','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  --bevel: inset 4px 4px 0 rgba(255,255,255,.55), inset -5px -5px 0 rgba(0,0,0,.28);
  --s:1;
}
body.day{ --bg-top:#5AA2FA; --bg-mid:#6FB1FC; --bg-bot:#A9D4FF; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
html,body{margin:0; height:100%; width:100%; overflow:hidden}
body{font-family:var(--body); color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%);
  transition:background .6s}

/* ---------- sky ---------- */
.sky{position:fixed; top:0; left:0; right:0; bottom:0; z-index:0; pointer-events:none; overflow:hidden}
.star{position:absolute; background:#FFF6C8; opacity:.55}
.star.tw{animation:twinkle 2.4s steps(3) infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
body.day .star{display:none}
.moon{position:absolute; top:7%; left:43%; width:90px; height:90px; border-radius:50%;
  background:#FFF3B0; box-shadow:0 0 40px 10px rgba(255,236,150,.45), inset -14px -10px 0 #F2D86A; transition:all .6s}
.moon::before,.moon::after{content:""; position:absolute; border-radius:50%; background:rgba(214,186,80,.55)}
.moon::before{width:18px;height:18px; top:24px; left:22px}
.moon::after{width:12px;height:12px; top:54px; left:48px}
body.day .moon{background:#FFE14D; box-shadow:0 0 0 10px rgba(255,236,120,.45),0 0 60px 20px rgba(255,236,120,.5)}
body.day .moon::before,body.day .moon::after{opacity:0}
.cloud{position:absolute; width:120px; height:42px; background:#fff; border-radius:24px; opacity:.16;
  animation:drift 40s linear infinite; transition:opacity .6s}
.cloud::before,.cloud::after{content:""; position:absolute; background:inherit; border-radius:50%}
.cloud::before{width:46%;height:120%; top:-55%; left:15%}
.cloud::after{width:32%;height:90%; top:-40%; left:52%}
body.day .cloud{opacity:.95}
@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}

.ground{position:fixed; left:0; right:0; bottom:0; height:calc(56px*var(--s)); z-index:1;
  background:linear-gradient(180deg,#E89F4A 0 18%,#C9772B 18% 100%); border-top:calc(5px*var(--s)) solid var(--ink)}
.ground::after{content:""; position:absolute; top:6px; left:0; right:0; bottom:0;
  background-image:linear-gradient(90deg, rgba(0,0,0,.25) 2px, transparent 2px),linear-gradient(rgba(0,0,0,.18) 2px, transparent 2px);
  background-size:calc(44px*var(--s)) calc(44px*var(--s)), calc(44px*var(--s)) calc(22px*var(--s))}

/* ---------- stage (fixed 1600x900, scaled to fit) ---------- */
#stage{position:absolute; left:50%; top:50%; width:1600px; height:900px; margin:-450px 0 0 -800px; z-index:3;
  transform-origin:50% 50%}
.shaker{position:absolute; left:0; top:0; width:100%; height:100%}
.shaker.shake{animation:shake .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-4px,2px)} 20%,80%{transform:translate(8px,-4px)}
  30%,50%,70%{transform:translate(-14px,6px)} 40%,60%{transform:translate(14px,-6px)}}

.outline{text-shadow:
  4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),
  4px 4px var(--ink),-4px 4px var(--ink),4px -4px var(--ink),-4px -4px var(--ink),7px 9px 0 rgba(0,0,0,.35)}

.left{position:absolute; left:70px; top:58px; width:590px}
.tag-en{font-family:var(--pixel); font-size:15px; color:#FFE07A; letter-spacing:2px;
  text-shadow:2px 2px 0 var(--ink)}
.title1{font-family:var(--disp); color:#fff; font-size:104px; line-height:1; margin-top:18px; letter-spacing:4px}
.title2{font-family:var(--disp); color:var(--gold); font-size:150px; line-height:1; margin-top:2px; letter-spacing:6px}
.subtitle{display:inline-block; margin-top:20px; font-family:var(--disp); color:#fff; font-size:29px; letter-spacing:2px;
  background:var(--red); border:4px solid var(--ink); padding:6px 18px; box-shadow:4px 4px 0 var(--ink)}

.legend{margin-top:26px; background:rgba(10,8,30,.45); border:5px solid var(--ink);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.18), 6px 6px 0 rgba(0,0,0,.35); padding:12px 20px; width:520px}
body.day .legend{background:rgba(20,40,110,.35)}
.lrow{display:flex; align-items:center; height:56px; transition:transform .2s, background .2s; padding:0 8px; margin:0 -8px}
.lrow.hit{background:rgba(255,230,120,.25); transform:scale(1.04); animation:rowblink .3s steps(2) 6}
@keyframes rowblink{50%{background:rgba(255,255,255,.45)}}
.lrow > * + *{margin-left:14px}
.lchip{width:30px; height:30px; border:4px solid var(--ink); box-shadow:inset 3px 3px 0 rgba(255,255,255,.4)}
.lnum{font-family:var(--pixel); font-size:28px; color:#fff; width:38px; text-shadow:3px 3px 0 var(--ink)}
.lname{font-family:var(--disp); font-size:28px; color:#fff; text-shadow:2px 2px 0 var(--ink); width:132px; letter-spacing:1px}
.lcoins{display:flex}
.mcoin + .mcoin{margin-left:5px}
.mcoin{width:22px; height:22px; border-radius:50%; border:3px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#FFF1A0,var(--gold) 60%,var(--gold-d))}
.lrow.hit .mcoin{animation:flip .7s ease-in-out infinite}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}

.status{margin-top:22px; font-family:var(--disp); color:#fff; font-size:32px; letter-spacing:2px; min-height:42px;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),4px 4px 0 rgba(0,0,0,.3)}
.status.beat{animation:beat .45s ease}
@keyframes beat{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.hint{font-family:var(--pixel); font-size:12px; color:rgba(255,255,255,.75); margin-top:8px; letter-spacing:1px}

.topbar{position:absolute; right:30px; top:22px; display:flex; z-index:20}
.topbar .btn + .btn{margin-left:12px}
.btn{font-family:var(--disp); cursor:pointer; border:4px solid var(--ink); color:#fff; padding:6px 16px; font-size:22px;
  letter-spacing:1px; box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.35); background:#2EA82E; transition:transform .1s}
.btn:active{transform:translate(3px,3px)}
.btn.b2{background:#6A55C8} .btn.b3{background:#8590A6}

/* ---------- wheel ---------- */
.wheel-box{position:absolute; left:730px; top:52px; width:790px; height:790px}
.wheel-box{cursor:pointer}
.wlayer{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; display:block}
/* 转盘盘面单独成一层，用 GPU 旋转，不再每帧重画 */
#rotorWrap{position:absolute; left:0; top:0; width:100%; height:100%; will-change:transform;
  -webkit-transform:rotate(0deg); transform:rotate(0deg); -webkit-backface-visibility:hidden; backface-visibility:hidden}
#rotorWrap svg{width:100%; height:100%; display:block; overflow:visible}
.bulb{fill:#6B5420}
.bulb.on{fill:#FFF3A0}
.wheel-box.win .bulb.on{fill:#fff}
#hubWrap{position:absolute; left:50%; top:50%; width:152px; height:152px; margin:-76px 0 0 -76px; will-change:transform;
  animation:hubpulse 1.4s ease-in-out infinite}
#hubWrap svg{width:100%; height:100%; display:block}
.wheel-box.busy #hubWrap{animation:none}
@keyframes hubpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.flash-sector{fill:#fff; opacity:0; pointer-events:none}
.flash-sector.on{animation:secflash .9s steps(2) 1}
@keyframes secflash{0%{opacity:.7}25%{opacity:0}50%{opacity:.7}75%{opacity:0}100%{opacity:0}}
.pointer{position:absolute; left:50%; top:-46px; width:96px; height:132px; z-index:5;
  transform:translateX(-50%); transform-origin:50% 36px; will-change:transform}
.pointer.bounce{animation:pbounce .5s ease}
@keyframes pbounce{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-18px)}}

.footnote{position:absolute; left:0; right:0; bottom:12px; text-align:center; color:#fff; font-family:var(--disp);
  font-size:22px; letter-spacing:3px; text-shadow:2px 2px 0 var(--ink); z-index:4}

/* ---------- jackpot fx ---------- */
.rays{position:fixed; left:50%; top:50%; width:110vmax; height:110vmax; margin:-55vmax 0 0 -55vmax; z-index:2; pointer-events:none;
  background-size:100% 100%; background-repeat:no-repeat; opacity:0; display:none}
.rays.show{display:block}
/* 金光只在出现时"砰"地展开一次，之后静止，不再持续转动（这是最耗性能的部分） */
.rays.on{opacity:1; animation:raysin .7s cubic-bezier(.2,.9,.3,1)}
@keyframes raysin{0%{opacity:0; transform:scale(.3) rotate(-40deg)}100%{opacity:1; transform:scale(1) rotate(0deg)}}
@keyframes spinrays{to{transform:rotate(360deg)}}
.whiteflash{position:fixed; top:0; left:0; right:0; bottom:0; background:#fff; z-index:60; pointer-events:none; opacity:0}
.whiteflash.on{animation:wflash .7s ease-out}
@keyframes wflash{0%{opacity:.95}100%{opacity:0}}
.jp{position:absolute; left:0; right:0; top:250px; text-align:center; z-index:50; pointer-events:none; opacity:0; will-change:transform,opacity; display:none}
.jp.on{display:block}
.jp .e{font-family:var(--pixel); font-size:46px; color:#fff; letter-spacing:6px; text-shadow:5px 5px 0 var(--red), 9px 9px 0 var(--ink)}
.jp .t{font-family:var(--disp); font-size:200px; line-height:1.1; color:var(--gold); letter-spacing:10px; margin-top:20px}
.jp.on{animation:slam 2s cubic-bezier(.2,.9,.3,1) forwards}

@keyframes slam{0%{opacity:0; transform:scale(3.2) rotate(-6deg)}14%{opacity:1; transform:scale(.92) rotate(2deg)}
  22%{transform:scale(1.06) rotate(-1deg)}30%{transform:scale(1)}78%{opacity:1; transform:scale(1)}100%{opacity:0; transform:scale(1.15)}}
@keyframes rainbow{0%{color:#FFC928}25%{color:#FF6B6B}50%{color:#5CE1FF}75%{color:#7CFF6B}100%{color:#FFC928}}

/* ---------- result card ---------- */
.result{position:absolute; top:-200px; left:-200px; right:-200px; bottom:-200px; display:flex; align-items:center; justify-content:center; z-index:40;
  pointer-events:none; opacity:0; transition:opacity .25s; background:rgba(12,8,36,.5); will-change:opacity}
.result.on{opacity:1; pointer-events:auto}
.card{background:var(--cream); border:6px solid var(--ink); box-shadow:var(--bevel),10px 10px 0 rgba(0,0,0,.45);
  width:720px; padding:30px 40px 34px; text-align:center; display:flex; flex-direction:column; align-items:center;
  transform:scale(.4) translateY(40px); transition:transform .4s cubic-bezier(.34,1.6,.5,1); position:relative; will-change:transform}
.card > * + *{margin-top:14px}
.result.on .card{transform:scale(1) translateY(0)}
.card.tierS{box-shadow:var(--bevel),0 0 0 8px #FFC928,0 0 36px 10px rgba(255,201,40,.7)}
.card.tierS::before{content:""; position:absolute; left:-16px; top:-16px; right:-16px; bottom:-16px; border:8px solid #FF6B6B;
  pointer-events:none; will-change:opacity; animation:blinkb .5s steps(1) infinite}
@keyframes blinkb{50%{opacity:0}}
@keyframes cardglow{0%{box-shadow:var(--bevel),0 0 0 8px #FFC928,0 0 60px 18px rgba(255,201,40,.7)}
  33%{box-shadow:var(--bevel),0 0 0 8px #FF6B6B,0 0 60px 18px rgba(255,107,107,.7)}
  66%{box-shadow:var(--bevel),0 0 0 8px #5CE1FF,0 0 60px 18px rgba(92,225,255,.7)}
  100%{box-shadow:var(--bevel),0 0 0 8px #FFC928,0 0 60px 18px rgba(255,201,40,.7)}}
.res-eye{font-family:var(--pixel); font-size:24px; color:#17803A; letter-spacing:3px}
.card.tierS .res-eye{color:var(--red)}
.res-coin{width:180px; height:180px; border-radius:50%; border:6px solid var(--ink); position:relative;
  background:radial-gradient(circle at 35% 30%,#FFF4B0,var(--gold) 58%,var(--gold-d));
  display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(255,201,40,.25)}
.res-coin::after{content:""; position:absolute; top:13%; left:13%; right:13%; bottom:13%; border:4px solid rgba(0,0,0,.28); border-radius:12px}
.res-coin{will-change:transform}
.res-coin.pop{animation:cpop .22s ease}
@keyframes cpop{50%{transform:scale(1.15) rotate(-6deg)}}
.res-coin span{font-family:var(--pixel); font-size:80px; color:#fff; position:relative; z-index:2;
  text-shadow:5px 0 var(--ink),-5px 0 var(--ink),0 5px var(--ink),0 -5px var(--ink),5px 5px var(--ink),-5px -5px var(--ink),5px -5px var(--ink),-5px 5px var(--ink)}
.res-coins{display:flex; height:52px; align-items:center}
.res-coins .c + .c{margin-left:12px}
.res-coins .c{width:46px; height:46px; border-radius:50%; border:4px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#FFF1A0,var(--gold) 60%,var(--gold-d)); opacity:.18; transform:scale(.7)}
.res-coins .c.got{opacity:1; animation:cgot .35s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes cgot{0%{transform:translateY(-60px) scale(.6)}100%{transform:translateY(0) scale(1)}}
.res-title{font-family:var(--disp); font-size:58px; letter-spacing:2px; color:#E07B00; text-shadow:3px 3px 0 rgba(0,0,0,.15)}
.res-sub{font-weight:800; color:#5a4a30; font-size:26px}
.btn-go{font-family:var(--disp); background:var(--red); font-size:34px; padding:10px 36px; margin-top:6px;
  border:4px solid var(--ink); color:#fff; cursor:pointer; box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.35); letter-spacing:3px}
.btn-go:active{transform:translate(3px,3px)}

canvas#fx{position:fixed; left:0; top:0; pointer-events:none; z-index:55}
body.fxbusy .cloud, body.fxbusy .star.tw, body.fxbusy #hubWrap, body.fxbusy .lrow.hit .mcoin{animation-play-state:paused}
.zoomctl{position:fixed; right:8px; bottom:8px; z-index:70; display:flex; align-items:center; background:rgba(0,0,0,.5);
  border:2px solid #1a1208; border-radius:6px; padding:3px 6px; font-family:var(--disp); color:#fff; font-size:15px; opacity:.6}
.zoomctl:hover{opacity:1}
.zoomctl button{font-family:var(--disp); font-size:18px; width:30px; height:28px; margin:0 4px; border:2px solid #1a1208; border-radius:4px;
  background:#FFC928; color:#1a1208; cursor:pointer; padding:0; line-height:1}
.zoomctl span{min-width:44px; text-align:center}

@media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important; transition-duration:.15s !important}}
</style>
</head>

      <path d="M30 26 A22 22 0 0 1 54 12" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="6" stroke-linecap="round"/>

<script>
/* =====================================================
   华特听写满分大转盘 · 优化版
   中奖概率：5枚10% / 4枚10% / 3枚10% / 2枚35% / 1枚35%
   ===================================================== */

/* ---------- 数据 ---------- */
const PRIZES = {
  5:{name:'超级大奖', color:'#FFC928', dark:'#C98A00'},
  4:{name:'一等奖',   color:'#EE3B3B', dark:'#A81E22'},
  3:{name:'二等奖',   color:'#2DBE55', dark:'#17803A'},
  2:{name:'三等奖',   color:'#2E86F0', dark:'#1B57A8'},
  1:{name:'幸运奖',   color:'#F2822B', dark:'#B0521A'},
};
// 转盘上 5 个等分扇区（从顶部顺时针）
const SECTORS = [
  {coins:2, start:0},  {coins:5, start:72}, {coins:1, start:144},
  {coins:4, start:216},{coins:3, start:288},
];
const WEIGHTS = {5:10, 4:10, 3:10, 2:35, 1:35};
function weightedPickCoins(){
  const total = Object.values(WEIGHTS).reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(const k of Object.keys(WEIGHTS)){ if(r < WEIGHTS[k]) return parseInt(k); r -= WEIGHTS[k]; }
  return 1;
}

/* ---------- 缩放适配 16:9 ---------- */
const stage = document.getElementById('stage');
let SCALE = 1, VW = 1600, VH = 900, userZoom = 1;
try{ const z = parseFloat(localStorage.getItem('walt-wheel-zoom')); if(z >= .5 && z <= 1.2) userZoom = z; }catch(e){}
function viewSize(){
  // 取几种测量方式中最小的那个，防止希沃等内嵌浏览器报的尺寸偏大
  const de = document.documentElement;
  let w = de.clientWidth || innerWidth, h = de.clientHeight || innerHeight;
  if(innerWidth) w = Math.min(w, innerWidth);
  if(innerHeight) h = Math.min(h, innerHeight);
  if(window.visualViewport && visualViewport.width){ w = Math.min(w, visualViewport.width); h = Math.min(h, visualViewport.height); }
  return [w, h];
}
function fit(){
  const v = viewSize(); VW = v[0]; VH = v[1];
  SCALE = Math.min(VW/1600, VH/900) * userZoom;
  const t = 'scale(' + SCALE + ')';
  stage.style.webkitTransform = t; stage.style.transform = t;
  document.documentElement.style.setProperty('--s', SCALE);
  fx.width = VW*DPR; fx.height = VH*DPR;
  fx.style.width = VW+'px'; fx.style.height = VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const zv = document.getElementById('zVal'); if(zv) zv.textContent = Math.round(userZoom*100) + '%';
}

/* ---------- 天空：星星、云 ---------- */
const sky = document.getElementById('sky');
for(let i=0;i<36;i++){
  const d = document.createElement('div'); d.className = i % 3 === 0 ? 'star tw' : 'star';
  const z = Math.random()<.25 ? 5 : (Math.random()<.5 ? 3 : 2);
  d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*82}%;width:${z}px;height:${z}px;animation-delay:${-Math.random()*2.4}s;animation-duration:${1.6+Math.random()*2}s`;
  sky.appendChild(d);
}
[[9,0],[22,-14],[14,-27]].forEach(([top,delay],i)=>{
  const c = document.createElement('div'); c.className='cloud';
  c.style.cssText = `top:${top}%;animation-delay:${delay}s;transform:scale(${[1,.8,1.15][i]})`;
  sky.appendChild(c);
});

/* ---------- 图例 ---------- */
const legend = document.getElementById('legend');
[5,4,3,2,1].forEach(n=>{
  const p = PRIZES[n];
  const row = document.createElement('div'); row.className='lrow'; row.id='lrow'+n;
  row.innerHTML = `<div class="lchip" style="background:${p.color}"></div><div class="lnum">${n}</div>
    <div class="lname">${p.name}</div><div class="lcoins">${Array.from({length:n},(_,i)=>`<div class="mcoin" style="animation-delay:${-(i*0.12)}s"></div>`).join('')}</div>`;
  legend.appendChild(row);
});

/* ---------- 画转盘（SVG） ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svgBase = document.getElementById('wheelBase'), svgRotor = document.getElementById('rotorSvg');
const svgTop = document.getElementById('wheelTop'), svgHub = document.getElementById('hubSvg');
const R = 318;            // 扇区半径
const RIM_OUT = 388, RIM_IN = 322, BULB_R = 355, NBULB = 30;
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e); return e;
}
function pt(deg, r){ const a = deg*Math.PI/180; return [r*Math.sin(a), -r*Math.cos(a)]; }
function sectorPath(a0, a1, r){
  const [x0,y0] = pt(a0,r), [x1,y1] = pt(a1,r);
  return `M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
function buildWheel(){
  const defs = el('defs', {}, svgRotor);
  defs.innerHTML = `
    <pattern id="pBrick" width="48" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0H48M0 12H48M0 0V12M24 12V24" stroke="rgba(0,0,0,.22)" stroke-width="3" fill="none"/></pattern>
    <pattern id="pDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="7" height="7" fill="rgba(255,255,255,.2)"/></pattern>
    <pattern id="pStripe" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="22" fill="rgba(255,255,255,.14)"/></pattern>
    <pattern id="pCheck" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="rgba(0,0,0,.1)"/><rect x="14" y="14" width="14" height="14" fill="rgba(0,0,0,.1)"/></pattern>
    <radialGradient id="gGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF6B8"/><stop offset=".55" stop-color="#FFC928"/><stop offset="1" stop-color="#F09A00"/></radialGradient>
    <radialGradient id="gShade" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.28)"/></radialGradient>
  `;
  const patterns = {1:'pBrick', 2:'pDots', 3:'pStripe', 4:'pCheck', 5:null};

  // 投影 + 外框
  const bdefs = el('defs', {}, svgBase);
  bdefs.innerHTML = '<linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset=".5" stop-color="#FFC928"/><stop offset="1" stop-color="#E39A00"/></linearGradient>';
  el('circle', {cx:12, cy:16, r:RIM_OUT+4, fill:'rgba(0,0,0,.35)'}, svgBase);
  el('circle', {cx:0, cy:0, r:RIM_OUT, fill:'url(#gRim)', stroke:'#1a1208', 'stroke-width':9}, svgBase);
  el('circle', {cx:0, cy:0, r:RIM_OUT-9, fill:'none', stroke:'rgba(255,255,255,.55)', 'stroke-width':5}, svgBase);

  // 旋转部分
  const rotor = el('g', {}, svgRotor);
  SECTORS.forEach(s=>{
    const p = PRIZES[s.coins], d = sectorPath(s.start, s.start+72, R);
    el('path', {d, fill: s.coins===5 ? 'url(#gGold)' : p.color}, rotor);
    if(patterns[s.coins]) el('path', {d, fill:`url(#${patterns[s.coins]})`}, rotor);
    if(s.coins===5){ // 超级大奖扇区加星星
      [[0,-290,14],[-50,-215,9],[52,-222,11],[-30,-118,8],[34,-112,8]].forEach(([x,y,r],i)=>{
        const g = el('g',{transform:`rotate(${s.start+36}) translate(${x} ${y})`}, rotor);
        el('path',{d:starPath(r), fill:'#fff', opacity:.85}, g);
      });
    }
  });
  el('circle', {cx:0, cy:0, r:R, fill:'url(#gShade)'}, rotor);
  SECTORS.forEach(s=>{
    const [x,y] = pt(s.start, R);
    el('line', {x1:0, y1:0, x2:x, y2:y, stroke:'#1a1208', 'stroke-width':7, 'stroke-linecap':'round'}, rotor);
  });
  // 中奖闪光层
  SECTORS.forEach(s=>{
    el('path', {d:sectorPath(s.start, s.start+72, R), class:'flash-sector', id:'flash'+s.coins}, rotor);
  });
  // 文字与金币
  SECTORS.forEach(s=>{
    const g = el('g', {transform:`rotate(${s.start+36})`}, rotor);
    const num = el('text', {x:0, y:-212, 'text-anchor':'middle', 'font-family':'PixelFont', 'font-size':84,
      fill:'#fff', stroke:'#1a1208', 'stroke-width':12, 'paint-order':'stroke', 'stroke-linejoin':'round'}, g);
    num.textContent = s.coins;
    const lab = el('text', {x:0, y:-160, 'text-anchor':'middle', 'font-family':'DispFont, Microsoft YaHei', 'font-size':38,
      fill:'#fff', stroke:'#1a1208', 'stroke-width':9, 'paint-order':'stroke', 'stroke-linejoin':'round', 'letter-spacing':2}, g);
    lab.textContent = '枚华特币';
    const n = s.coins, gap = 32, cy = -112, w = (n-1)*gap;
    for(let i=0;i<n;i++){
      const cx = -w/2 + i*gap;
      el('circle', {cx, cy, r:13, fill:'#FFC928', stroke:'#1a1208', 'stroke-width':4}, g);
      el('rect', {x:cx-3, y:cy-7, width:6, height:14, fill:'rgba(0,0,0,.28)'}, g);
    }
  });
  el('circle', {cx:0, cy:0, r:R, fill:'none', stroke:'#1a1208', 'stroke-width':9}, svgTop);

  // 跑马灯
  const bulbs = el('g', {id:'bulbs'}, svgTop);
  for(let i=0;i<NBULB;i++){
    const [x,y] = pt(i*360/NBULB, BULB_R);
    el('circle', {cx:x, cy:y, r:10, class:'bulb', stroke:'#1a1208', 'stroke-width':4}, bulbs);
  }

  // 中心 GO 按钮
  const hub = el('g', {}, svgHub);
  el('rect', {x:-70, y:-70, width:140, height:140, rx:16, fill:'#FFC928', stroke:'#1a1208', 'stroke-width':8}, hub);
  el('path', {d:'M-58 54 V-58 H54', fill:'none', stroke:'rgba(255,255,255,.65)', 'stroke-width':7}, hub);
  el('path', {d:'M-54 58 H58 V-54', fill:'none', stroke:'rgba(0,0,0,.25)', 'stroke-width':7}, hub);
  [[-48,-48],[48,-48],[-48,48],[48,48]].forEach(([x,y])=>el('rect',{x:x-5,y:y-5,width:10,height:10,fill:'#1a1208'},hub));
  const go = el('text', {x:2, y:20, 'text-anchor':'middle', 'font-family':'PixelFont', 'font-size':44, fill:'#fff',
    stroke:'#1a1208', 'stroke-width':9, 'paint-order':'stroke'}, hub);
  go.textContent = 'GO';
}
function starPath(r){
  let d=''; for(let i=0;i<10;i++){ const rr = i%2? r*.45 : r, a = i*Math.PI/5;
    d += (i?'L':'M') + (rr*Math.sin(a)).toFixed(1)+' '+(-rr*Math.cos(a)).toFixed(1); }
  return d+'Z';
}

let bulbMode = 'idle', bulbStep = 0, bulbTimer = null;
function setBulbs(mode){
  bulbMode = mode; clearInterval(bulbTimer);
  const speed = {idle:450, spin:110, win:160}[mode];
  bulbTimer = setInterval(()=>{
    bulbStep++;
    bulbEls.forEach((b,i)=>{
      let on;
      if(mode==='idle') on = (i + bulbStep) % 2 === 0;
      else if(mode==='spin') on = (i + bulbStep) % 5 < 2;
      else on = bulbStep % 2 === 0;
      if(b._on !== on){ b._on = on; b.setAttribute('class', on ? 'bulb on' : 'bulb'); }

let soundOn = true, actx = null, master = null;
let TC = null, TD = null;   // 合成目标：预录时是离线音频，兜底时是喇叭
function ac(){
  if(!actx){
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      master = actx.createGain(); master.gain.value = .9;
      master.connect(comp); comp.connect(actx.destination);
    }catch(e){ return null; }
  }
  if(actx.state === 'suspended' && actx.resume) actx.resume();
  return actx;
}
function tone(freq, t0, dur, o={}){
  const c = TC; if(!c) return;
  const {type='square', vol=.14, slideTo=null, attack=.004} = o;
  const osc = c.createOscillator(), g = c.createGain();
  const st = c.currentTime + t0;
  osc.type = type; osc.frequency.setValueAtTime(freq, st);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, st+dur);
  g.gain.setValueAtTime(.0001, st);
  g.gain.linearRampToValueAtTime(vol, st+attack);
  g.gain.setValueAtTime(vol, st + Math.max(attack, dur*.55));
  g.gain.exponentialRampToValueAtTime(.0001, st+dur);
  osc.connect(g); g.connect(TD); osc.start(st); osc.stop(st+dur+.03);
}
function noise(t0, dur, vol=.3, f0=2400, f1=200){
  const c = TC; if(!c) return;
  const len = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type='lowpass';
  const st = c.currentTime + t0;
  f.frequency.setValueAtTime(f0, st); f.frequency.exponentialRampToValueAtTime(f1, st+dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, st); g.gain.exponentialRampToValueAtTime(.0001, st+dur);
  src.connect(f); f.connect(g); g.connect(TD); src.start(st); src.stop(st+dur);
}

const LEN = {tick:.12, coin:.55, start:.35, click:.15, small:1.05, mid:2.15, jackpot:3.35, pop:.45};
const BUF = {};
function prerenderSounds(){
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if(!OAC) return;
  const names = Object.keys(RECIPES); let i = 0;
  (function next(){
    if(i >= names.length) return;
    const name = names[i++]; let got = false;
    const done = b => { if(got) return; got = true; if(b) BUF[name] = b; setTimeout(next, 20); };
    try{
      const sr = 32000, off = new OAC(1, Math.ceil(sr*LEN[name]), sr);
      TC = off; TD = off.destination; RECIPES[name](); TC = null; TD = null;
      off.oncomplete = e => done(e.renderedBuffer);
      const pr = off.startRendering();
      if(pr && pr.then) pr.then(done, ()=>done(null));
    }catch(e){ TC = null; TD = null; done(null); }
  })();
}
function play(name, rate=1, vol=1){
  if(!soundOn) return; const c = ac(); if(!c) return;
  if(BUF[name]){
    const src = c.createBufferSource(); src.buffer = BUF[name]; src.playbackRate.value = rate;
    const g = c.createGain(); g.gain.value = vol; src.connect(g); g.connect(master); src.start(0);
  } else { TC = c; TD = master; try{ RECIPES[name](); }catch(e){} TC = null; TD = null; }
}
const SFX = {
  tick:()=>play('tick'), coin:(p=1, v=.15)=>play('coin', p, v/.15), start:()=>play('start'), click:()=>play('click'),

};

function groundY(){ return VH - 56*SCALE; }
function addPart(p){

function sprite(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
const CS = 40, COIN_FR = [];
for(let f=0; f<8; f++){
  const ph = f/8*Math.PI, cosv = Math.cos(ph);
  COIN_FR.push(sprite(CS+8, CS+8, (g,W,H)=>{
    g.translate(W/2, H/2);
    const w = CS*Math.abs(cosv), h = CS;
    g.fillStyle = '#1a1208'; g.beginPath(); g.ellipse(0,0,w/2+3,h/2+3,0,0,Math.PI*2); g.fill();
    g.fillStyle = cosv >= 0 ? '#FFC928' : '#E7A400'; g.beginPath(); g.ellipse(0,0,Math.max(w/2,1),h/2,0,0,Math.PI*2); g.fill();
    if(w > h*.35){ g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(-w*.08,-h*.28,w*.16,h*.56); g.fillStyle='rgba(255,255,255,.7)'; g.fillRect(-w*.32,-h*.3,w*.1,h*.22); }
  }));
}
const STAR_FR = ['#FFF6B0','#FFC928','#FFFFFF'].map(col => sprite(52, 52, (g,W,H)=>{
  g.translate(W/2, H/2); g.fillStyle = col; g.beginPath();
  for(let i=0;i<10;i++){ const r = i%2 ? 24*.42 : 24, a = i*Math.PI/5; g[i?'lineTo':'moveTo'](r*Math.sin(a), -r*Math.cos(a)); }
  g.closePath(); g.fill();
}));

      ci:i%3, maxLife:100, fade:true}); }

let lastRainDing = 0;
function loop(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,VW,VH);
  const gy = groundY(), now = Date.now(), PI = Math.PI;
  const keep = [];
  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    p.life++; p.vy += p.g; if(p.drag){ p.vx*=p.drag; p.vy*=p.drag; }
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.type==='coin'){
      p.ph += p.vph;
      if(p.vy > 11) p.vy = 11;
      if(!p.bounced && p.y > gy - p.s/2){ p.y = gy - p.s/2; p.vy *= -.5; p.vx *= 1.5; p.bounced = true;
        if(now - lastRainDing > 160 && Math.random() < .4){ lastRainDing = now; SFX.coin(1 + Math.random()*.25, .05); } }
      if(p.bounced) p.alpha -= .035;
    }
    if(p.fade) p.alpha = 1 - p.life/p.maxLife;
    if(p.life < p.maxLife && p.alpha > 0 && p.y < VH + 80) keep.push(p);
  }
  parts = keep;
  for(let i=0;i<parts.length;i++){
    const p = parts[i];
    ctx.globalAlpha = p.alpha > 1 ? 1 : p.alpha;
    if(p.type==='coin'){
      const fi = Math.floor(((p.ph % PI) + PI) % PI / PI * 8) & 7, fr = COIN_FR[fi], k = p.s/CS;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      ctx.drawImage(fr, p.x - fr.width*k/2, p.y - fr.height*k/2, fr.width*k, fr.height*k);
    } else if(p.type==='spark'){
      ctx.setTransform(DPR,0,0,DPR,0,0);
      ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s);
    } else {
      const c = Math.cos(p.rot), sn = Math.sin(p.rot);
      ctx.setTransform(DPR*c, DPR*sn, -DPR*sn, DPR*c, DPR*p.x, DPR*p.y);
      if(p.type==='star') ctx.drawImage(STAR_FR[p.ci], -p.s*1.08, -p.s*1.08, p.s*2.16, p.s*2.16);
      else { ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); }
    }
  }
  ctx.globalAlpha = 1; ctx.setTransform(DPR,0,0,DPR,0,0);
  if(parts.length) requestAnimationFrame(loop); else { rafOn=false; ctx.clearRect(0,0,VW,VH); }
}

// 和 CSS 里 cubic-bezier(.17,.67,.22,1) 一致的缓动，用来推算指针什么时候过一格
const BZ = [.17,.67,.22,1];
function bez(t){
  const [x1,y1,x2,y2] = BZ;
  const cx = 3*x1, bx = 3*(x2-x1)-cx, ax = 1-cx-bx, cy = 3*y1, by = 3*(y2-y1)-cy, ay = 1-cy-by;
  const X = u => ((ax*u+bx)*u+cx)*u, Y = u => ((ay*u+by)*u+cy)*u, dX = u => (3*ax*u+2*bx)*u+cx;
  let u = t; for(let i=0;i<8;i++){ const d = dX(u); if(Math.abs(d) < 1e-6) break; u -= (X(u)-t)/d; }
  u = Math.max(0, Math.min(1, u)); return Y(u);
}

function spin(){
  if(spinning || modalOpen) return;
  spinning = true; ac();
  wheelBox.classList.add('busy'); wheelBox.classList.remove('win');
  document.querySelectorAll('.lrow').forEach(r=>r.classList.remove('hit'));
  setBulbs('spin'); SFX.start();
  setStatus('转盘转动中，盯紧啦！👀');

  const coinsWon = weightedPickCoins();
  const sec = SECTORS.find(s => s.coins === coinsWon);
  const margin = 10;
  const a = sec.start + margin + Math.random()*(72 - margin*2);
  const curMod = ((rot % 360) + 360) % 360;
  const tgtMod = ((360 - a) % 360 + 360) % 360;
  const total = EXTRA_TURNS*360 + ((tgtMod - curMod + 360) % 360);
  const startRot = rot, endRot = rot + total;
  rot = endRot;
  // 交给浏览器的 GPU 去转，主线程卡一下也不影响转盘流畅
  const tr = 'transform ' + SPIN_MS + 'ms cubic-bezier(' + BZ.join(',') + ')';
  rotorWrap.style.webkitTransition = '-webkit-' + tr; rotorWrap.style.transition = tr;
  void rotorWrap.offsetWidth;
  setRot(endRot);
  const t0 = Date.now();
  let lastPeg = Math.floor(startRot/PEG), lastTick = 0;
  const tickTimer = setInterval(()=>{
    const now = Date.now(), t = Math.min(1, (now - t0)/SPIN_MS);
    const cur = startRot + total*bez(t), peg = Math.floor(cur/PEG);
    if(peg !== lastPeg){
      lastPeg = peg;
      if(now - lastTick > 45){ lastTick = now; SFX.tick(); flickPointer(); }
    }
    if(t >= 1) clearInterval(tickTimer);
  }, 16);
  setTimeout(()=>land(coinsWon), SPIN_MS + 80);
}

function land(n){

  pointer.classList.remove('bounce'); void pointer.offsetWidth; pointer.classList.add('bounce');

    later(()=>{ SFX.mid(); starBurst(cx, cy, 24, 13); }, 450);
    later(()=>coinShower(28, 1, 1200), 600);
    later(()=>openResult(n, tier), 1050);

    later(()=>{ SFX.small(); confetti(cx, cy - 80, 60, 15); }, 450);
    later(()=>openResult(n, tier), 950);
  }
}

    }, 380 + (i-1)*270);
  }
  later(()=>{ if(tier !== 'B'){ const r = resCoin.getBoundingClientRect(); starBurst(r.left+r.width/2, r.top+r.height/2, 16, 9); } }, 420 + n*270);
}
function closeResult(){
  if(!modalOpen) return;
  modalOpen = false; SFX.click();
  timers.forEach(clearTimeout); timers = [];
  resultEl.classList.remove('on'); rays.classList.remove('on'); rays.classList.remove('show'); jp.classList.remove('on');
  document.body.classList.remove('fxbusy');
  wheelBox.classList.remove('busy','win'); setBulbs('idle');
  document.querySelectorAll('.lrow').forEach(r=>r.classList.remove('hit'));
  setStatus('点击转盘，开始抽取华特币奖励！');
}

document.getElementById('wheelBox').addEventListener('click', spin);
document.getElementById('againBtn').addEventListener('click', closeResult);
addEventListener('keydown', e=>{
  const k = e.keyCode;
  if(k === 32 || k === 13 || k === 33 || k === 34){ e.preventDefault(); modalOpen ? closeResult() : spin(); }
  else if(k === 187 || k === 107 || e.key === '+' || e.key === '='){ setZoom(userZoom + .05); }
  else if(k === 189 || k === 109 || e.key === '-'){ setZoom(userZoom - .05); }
});

/* ---------- 按钮 ---------- */
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', ()=>{ soundOn = !soundOn; soundBtn.textContent = soundOn ? '🔊 声音' : '🔇 静音'; if(soundOn) SFX.coin(); });
const themeBtn = document.getElementById('themeBtn');
function applyTheme(day){ document.body.classList.toggle('day', day); themeBtn.textContent = day ? '🌙 夜晚' : '☀️ 白天'; }
try{ applyTheme(localStorage.getItem('walt-wheel-theme') === 'day'); }catch(e){}
themeBtn.addEventListener('click', ()=>{ const day = !document.body.classList.contains('day'); applyTheme(day); SFX.click();
  try{ localStorage.setItem('walt-wheel-theme', day ? 'day' : 'night'); }catch(e){} });
const fsBtn = document.getElementById('fsBtn');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
fsBtn.addEventListener('click', ()=>{
  try{
    const de = document.documentElement;
    if(!fsEl()){ const r = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); if(r && r.catch) r.catch(()=>{}); }
    else { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  }catch(e){}
});
function onFs(){ fsBtn.textContent = fsEl() ? '⛶ 退出全屏' : '⛶ 全屏'; setTimeout(fit, 200); }
document.addEventListener('fullscreenchange', onFs); document.addEventListener('webkitfullscreenchange', onFs);

/* ---------- 画面大小微调（希沃底部有工具栏挡住时用） ---------- */
function setZoom(z){
  userZoom = Math.max(.5, Math.min(1.2, Math.round(z*100)/100));
  try{ localStorage.setItem('walt-wheel-zoom', userZoom); }catch(e){}
  fit();
}
document.getElementById('zOut').addEventListener('click', e=>{ e.stopPropagation(); setZoom(userZoom - .05); });
document.getElementById('zIn').addEventListener('click', e=>{ e.stopPropagation(); setZoom(userZoom + .05); });

addEventListener('resize', fit);
addEventListener('orientationchange', ()=>setTimeout(fit, 300));
if(window.visualViewport) visualViewport.addEventListener('resize', fit);
if(window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
fit(); [100, 400, 1000, 2500].forEach(ms=>setTimeout(fit, ms));
</script>
</body>

:root{
  --bg-top:#120E33; --bg-mid:#2A1F6B; --bg-bot:#7A3C9E;
  --gold:#FFC928; --gold-d:#D99500; --red:#E52521; --ink:#1a1208; --cream:#FFF7E6;
  --pixel:'PixelFont',monospace;
  --disp:'DispFont','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  --bevel: inset 4px 4px 0 rgba(255,255,255,.55), inset -5px -5px 0 rgba(0,0,0,.28);
  --s:1;
}
body.day{ --bg-top:#5AA2FA; --bg-mid:#6FB1FC; --bg-bot:#A9D4FF; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
html,body{margin:0; height:100%; width:100%; overflow:hidden}
body{font-family:var(--body); color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%);
  transition:background .6s}

/* ---------- sky ---------- */
.sky{position:fixed; top:0; left:0; right:0; bottom:0; z-index:0; pointer-events:none; overflow:hidden}
.star{position:absolute; background:#FFF6C8; opacity:.55}
.star.tw{animation:twinkle 2.4s steps(3) infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
body.day .star{display:none}
.moon{position:absolute; top:7%; left:43%; width:90px; height:90px; border-radius:50%;
  background:#FFF3B0; box-shadow:0 0 40px 10px rgba(255,236,150,.45), inset -14px -10px 0 #F2D86A; transition:all .6s}
.moon::before,.moon::after{content:""; position:absolute; border-radius:50%; background:rgba(214,186,80,.55)}
.moon::before{width:18px;height:18px; top:24px; left:22px}
.moon::after{width:12px;height:12px; top:54px; left:48px}
body.day .moon{background:#FFE14D; box-shadow:0 0 0 10px rgba(255,236,120,.45),0 0 60px 20px rgba(255,236,120,.5)}
body.day .moon::before,body.day .moon::after{opacity:0}
.cloud{position:absolute; width:120px; height:42px; background:#fff; border-radius:24px; opacity:.16;
  animation:drift 40s linear infinite; transition:opacity .6s}
.cloud::before,.cloud::after{content:""; position:absolute; background:inherit; border-radius:50%}
.cloud::before{width:46%;height:120%; top:-55%; left:15%}
.cloud::after{width:32%;height:90%; top:-40%; left:52%}
body.day .cloud{opacity:.95}
@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}

.ground{position:fixed; left:0; right:0; bottom:0; height:calc(56px*var(--s)); z-index:1;
  background:linear-gradient(180deg,#E89F4A 0 18%,#C9772B 18% 100%); border-top:calc(5px*var(--s)) solid var(--ink)}
.ground::after{content:""; position:absolute; top:6px; left:0; right:0; bottom:0;
  background-image:linear-gradient(90deg, rgba(0,0,0,.25) 2px, transparent 2px),linear-gradient(rgba(0,0,0,.18) 2px, transparent 2px);
  background-size:calc(44px*var(--s)) calc(44px*var(--s)), calc(44px*var(--s)) calc(22px*var(--s))}

/* ---------- stage (fixed 1600x900, scaled to fit) ---------- */
#stage{position:absolute; left:50%; top:50%; width:1600px; height:900px; margin:-450px 0 0 -800px; z-index:3;
  transform-origin:50% 50%}
.shaker{position:absolute; left:0; top:0; width:100%; height:100%}
.shaker.shake{animation:shake .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-4px,2px)} 20%,80%{transform:translate(8px,-4px)}
  30%,50%,70%{transform:translate(-14px,6px)} 40%,60%{transform:translate(14px,-6px)}}

.outline{text-shadow:
  4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),
  4px 4px var(--ink),-4px 4px var(--ink),4px -4px var(--ink),-4px -4px var(--ink),7px 9px 0 rgba(0,0,0,.35)}

.left{position:absolute; left:70px; top:58px; width:590px}

<script>
/* =====================================================
   华特听写满分大转盘 · 优化版
   中奖概率：5枚10% / 4枚10% / 3枚10% / 2枚35% / 1枚35%
   ===================================================== */

/* ---------- 数据 ---------- */
const PRIZES = {
  5:{name:'超级大奖', color:'#FFC928', dark:'#C98A00'},
  4:{name:'一等奖',   color:'#EE3B3B', dark:'#A81E22'},
  3:{name:'二等奖',   color:'#2DBE55', dark:'#17803A'},
  2:{name:'三等奖',   color:'#2E86F0', dark:'#1B57A8'},
  1:{name:'幸运奖',   color:'#F2822B', dark:'#B0521A'},
};
// 转盘上 5 个等分扇区（从顶部顺时针）
const SECTORS = [
  {coins:2, start:0},  {coins:5, start:72}, {coins:1, start:144},
  {coins:4, start:216},{coins:3, start:288},
];
const WEIGHTS = {5:10, 4:10, 3:10, 2:35, 1:35};
function weightedPickCoins(){
  const total = Object.values(WEIGHTS).reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(const k of Object.keys(WEIGHTS)){ if(r < WEIGHTS[k]) return parseInt(k); r -= WEIGHTS[k]; }
  return 1;
}

/* ---------- 缩放适配 16:9 ---------- */
const stage = document.getElementById('stage');
let SCALE = 1, VW = 1600, VH = 900, userZoom = 1;
try{ const z = parseFloat(localStorage.getItem('walt-wheel-zoom')); if(z >= .5 && z <= 1.2) userZoom = z; }catch(e){}
function viewSize(){
  // 取几种测量方式中最小的那个，防止希沃等内嵌浏览器报的尺寸偏大
  const de = document.documentElement;
  let w = de.clientWidth || innerWidth, h = de.clientHeight || innerHeight;
  if(innerWidth) w = Math.min(w, innerWidth);
  if(innerHeight) h = Math.min(h, innerHeight);
  if(window.visualViewport && visualViewport.width){ w = Math.min(w, visualViewport.width); h = Math.min(h, visualViewport.height); }
  return [w, h];
}
function fit(){
  const v = viewSize(); VW = v[0]; VH = v[1];
  SCALE = Math.min(VW/1600, VH/900) * userZoom;
  const t = 'scale(' + SCALE + ')';
  stage.style.webkitTransform = t; stage.style.transform = t;
  document.documentElement.style.setProperty('--s', SCALE);
  fx.width = VW*DPR; fx.height = VH*DPR;
  fx.style.width = VW+'px'; fx.style.height = VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const zv = document.getElementById('zVal'); if(zv) zv.textContent = Math.round(userZoom*100) + '%';
}

/* ---------- 天空：星星、云 ---------- */
const sky = document.getElementById('sky');
for(let i=0;i<36;i++){
  const d = document.createElement('div'); d.className = i % 3 === 0 ? 'star tw' : 'star';
  const z = Math.random()<.25 ? 5 : (Math.random()<.5 ? 3 : 2);
  d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*82}%;width:${z}px;height:${z}px;animation-delay:${-Math.random()*2.4}s;animation-duration:${1.6+Math.random()*2}s`;
  sky.appendChild(d);
}
[[9,0],[22,-14],[14,-27]].forEach(([top,delay],i)=>{
  const c = document.createElement('div'); c.className='cloud';
  c.style.cssText = `top:${top}%;animation-delay:${delay}s;transform:scale(${[1,.8,1.15][i]})`;
  sky.appendChild(c);
});

/* ---------- 图例 ---------- */
const legend = document.getElementById('legend');
[5,4,3,2,1].forEach(n=>{
  const p = PRIZES[n];
  const row = document.createElement('div'); row.className='lrow'; row.id='lrow'+n;
  row.innerHTML = `<div class="lchip" style="background:${p.color}"></div><div class="lnum">${n}</div>
    <div class="lname">${p.name}</div><div class="lcoins">${Array.from({length:n},(_,i)=>`<div class="mcoin" style="animation-delay:${-(i*0.12)}s"></div>`).join('')}</div>`;
  legend.appendChild(row);
});

/* ---------- 画转盘（SVG） ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svgBase = document.getElementById('wheelBase'), svgRotor = document.getElementById('rotorSvg');
const svgTop = document.getElementById('wheelTop'), svgHub = document.getElementById('hubSvg');
const R = 318;            // 扇区半径
const RIM_OUT = 388, RIM_IN = 322, BULB_R = 355, NBULB = 30;
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e); return e;
}
function pt(deg, r){ const a = deg*Math.PI/180; return [r*Math.sin(a), -r*Math.cos(a)]; }
function sectorPath(a0, a1, r){
  const [x0,y0] = pt(a0,r), [x1,y1] = pt(a1,r);
  return `M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
function buildWheel(){
  const defs = el('defs', {}, svgRotor);
  defs.innerHTML = `
    <pattern id="pBrick" width="48" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0H48M0 12H48M0 0V12M24 12V24" stroke="rgba(0,0,0,.22)" stroke-width="3" fill="none"/></pattern>
    <pattern id="pDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="7" height="7" fill="rgba(255,255,255,.2)"/></pattern>
    <pattern id="pStripe" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="22" fill="rgba(255,255,255,.14)"/></pattern>
    <pattern id="pCheck" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="rgba(0,0,0,.1)"/><rect x="14" y="14" width="14" height="14" fill="rgba(0,0,0,.1)"/></pattern>
    <radialGradient id="gGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF6B8"/><stop offset=".55" stop-color="#FFC928"/><stop offset="1" stop-color="#F09A00"/></radialGradient>
    <radialGradient id="gShade" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.28)"/></radialGradient>
  `;
  const patterns = {1:'pBrick', 2:'pDots', 3:'pStripe', 4:'pCheck', 5:null};

  const bdefs = el('defs', {}, svgBase);
  bdefs.innerHTML = '<linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset=".5" stop-color="#FFC928"/><stop offset="1" stop-color="#E39A00"/></linearGradient>';
  el('circle', {cx:12, cy:16, r:RIM_OUT+4, fill:'rgba(0,0,0,.35)'}, svgBase);
  el('circle', {cx:0, cy:0, r:RIM_OUT, fill:'url(#gRim)', stroke:'#1a1208', 'stroke-width':9}, svgBase);
  el('circle', {cx:0, cy:0, r:RIM_OUT-9, fill:'none', stroke:'rgba(255,255,255,.55)', 'stroke-width':5}, svgBase);

  // 旋转部分
  const rotor = el('g', {}, svgRotor);
  SECTORS.forEach(s=>{
    const p = PRIZES[s.coins], d = sectorPath(s.start, s.start+72, R);
    el('path', {d, fill: s.coins===5 ? 'url(#gGold)' : p.color}, rotor);
    if(patterns[s.coins]) el('path', {d, fill:`url(#${patterns[s.coins]})`}, rotor);
    if(s.coins===5){ // 超级大奖扇区加星星
      [[0,-290,14],[-50,-215,9],[52,-222,11],[-30,-118,8],[34,-112,8]].forEach(([x,y,r],i)=>{
        const g = el('g',{transform:`rotate(${s.start+36}) translate(${x} ${y})`}, rotor);
        el('path',{d:starPath(r), fill:'#fff', opacity:.85}, g);
      });
    }
  });
  el('circle', {cx:0, cy:0, r:R, fill:'url(#gShade)'}, rotor);
  SECTORS.forEach(s=>{
    const [x,y] = pt(s.start, R);

let soundOn = true, actx = null, master = null;
function ac(){
  if(!actx){
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      master = actx.createGain(); master.gain.value = .9;
      master.connect(comp); comp.connect(actx.destination);
    }catch(e){ return null; }
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, t0, dur, o={}){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const {type='square', vol=.14, slideTo=null, attack=.004} = o;
  const osc = c.createOscillator(), g = c.createGain();
  const st = c.currentTime + t0;
  osc.type = type; osc.frequency.setValueAtTime(freq, st);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, st+dur);
  g.gain.setValueAtTime(.0001, st);
  g.gain.linearRampToValueAtTime(vol, st+attack);
  g.gain.setValueAtTime(vol, st + Math.max(attack, dur*.55));
  g.gain.exponentialRampToValueAtTime(.0001, st+dur);
  osc.connect(g); g.connect(master); osc.start(st); osc.stop(st+dur+.03);
}
function noise(t0, dur, vol=.3, f0=2400, f1=200){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const len = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type='lowpass';
  const st = c.currentTime + t0;
  f.frequency.setValueAtTime(f0, st); f.frequency.exponentialRampToValueAtTime(f1, st+dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, st); g.gain.exponentialRampToValueAtTime(.0001, st+dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(st); src.stop(st+dur);
}
const NOTE = n => 440*Math.pow(2,(n-69)/12);   // MIDI → Hz

const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
const DPR = 1;   // 大屏上用 1 倍分辨率画特效，省性能
let parts = [], rafOn = false;
function groundY(){ return VH - 56*SCALE; }
function addPart(p){ parts.push(Object.assign({life:0, maxLife:300, rot:0, vr:0, alpha:1}, p)); if(!rafOn){ rafOn=true; requestAnimationFrame(loop); } }
const COLORS = ['#FFC928','#E52521','#2DBE55','#2E86F0','#FFFFFF','#F2822B','#B06CFF'];
function wheelCenter(){ const r = document.getElementById('wheelBox').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2, r.width/2]; }
function confetti(x, y, n=160, power=15){

function starBurst(x, y, n=36, sp=12){

    addPart({type:'star', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-3, g:.22, s:12+Math.random()*12, vr:(Math.random()-.5)*.3,

function firework(x, y){

  for(let i=0;i<44;i++){ const a = i/44*Math.PI*2, v = 5+Math.random()*6;
    addPart({type:'spark', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:.08, s:5+Math.random()*4, c, maxLife:75, fade:true, drag:.97}); }
}
function drawCoin(p){
  const w = p.s*Math.abs(Math.cos(p.ph)), h = p.s;
  ctx.fillStyle = '#1a1208';
  ctx.beginPath(); ctx.ellipse(0,0,w/2+3,h/2+3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = Math.cos(p.ph) > 0 ? '#FFC928' : '#E7A400';
  ctx.beginPath(); ctx.ellipse(0,0,Math.max(w/2,1),h/2,0,0,Math.PI*2); ctx.fill();
  if(w > h*.35){
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-w*.08,-h*.28,w*.16,h*.56);
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(-w*.32,-h*.3,w*.1,h*.22);
  }
}
function drawStar(s){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const r = i%2? s*.42 : s, a = i*Math.PI/5; ctx[i?'lineTo':'moveTo'](r*Math.sin(a), -r*Math.cos(a)); }
  ctx.closePath(); ctx.fill();
}
let lastRainDing = 0;
function loop(){
  ctx.clearRect(0,0,VW,VH);
  const gy = groundY(), now = performance.now();
  for(const p of parts){
    p.life++; p.vy += p.g; if(p.drag){ p.vx*=p.drag; p.vy*=p.drag; }
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.type==='coin'){
      p.ph += p.vph;
      if(p.vy > 11) p.vy = 11;
      if(!p.bounced && p.y > gy - p.s/2){ p.y = gy - p.s/2; p.vy *= -.5; p.vx *= 1.5; p.bounced = true;
        if(now - lastRainDing > 140 && Math.random() < .5){ lastRainDing = now; SFX.coin(1 + Math.random()*.25, .05); } }
      if(p.bounced) p.alpha -= .035;
    }
    if(p.fade) p.alpha = 1 - p.life/p.maxLife;
  }
  parts = parts.filter(p=> p.life < p.maxLife && p.alpha > 0 && p.y < VH + 80);
  for(const p of parts){
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1,p.alpha)); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
    if(p.type==='coin') drawCoin(p);
    else if(p.type==='star') drawStar(p.s);
    else ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
    ctx.restore();
  }
  if(parts.length) requestAnimationFrame(loop); else { rafOn=false; ctx.clearRect(0,0,VW,VH); }
}

// 和 CSS 里 cubic-bezier(.17,.67,.22,1) 一致的缓动，用来推算指针什么时候过一格
const BZ = [.17,.67,.22,1];
function bez(t){
  const [x1,y1,x2,y2] = BZ;
  const cx = 3*x1, bx = 3*(x2-x1)-cx, ax = 1-cx-bx, cy = 3*y1, by = 3*(y2-y1)-cy, ay = 1-cy-by;
  const X = u => ((ax*u+bx)*u+cx)*u, Y = u => ((ay*u+by)*u+cy)*u, dX = u => (3*ax*u+2*bx)*u+cx;
  let u = t; for(let i=0;i<8;i++){ const d = dX(u); if(Math.abs(d) < 1e-6) break; u -= (X(u)-t)/d; }
  u = Math.max(0, Math.min(1, u)); return Y(u);
}

function spin(){
  if(spinning || modalOpen) return;
  spinning = true; ac();
  wheelBox.classList.add('busy'); wheelBox.classList.remove('win');

  setBulbs('spin'); SFX.start();
  setStatus('转盘转动中，盯紧啦！👀');

  const coinsWon = weightedPickCoins();
  const sec = SECTORS.find(s => s.coins === coinsWon);
  const margin = 10;
  const a = sec.start + margin + Math.random()*(72 - margin*2);
  const curMod = ((rot % 360) + 360) % 360;
  const tgtMod = ((360 - a) % 360 + 360) % 360;
  const total = EXTRA_TURNS*360 + ((tgtMod - curMod + 360) % 360);
  const startRot = rot, endRot = rot + total;
  rot = endRot;
  // 交给浏览器的 GPU 去转，主线程卡一下也不影响转盘流畅
  const tr = 'transform ' + SPIN_MS + 'ms cubic-bezier(' + BZ.join(',') + ')';
  rotorWrap.style.webkitTransition = '-webkit-' + tr; rotorWrap.style.transition = tr;
  void rotorWrap.offsetWidth;
  setRot(endRot);
  const t0 = Date.now();
  let lastPeg = Math.floor(startRot/PEG), lastTick = 0;
  const tickTimer = setInterval(()=>{
    const now = Date.now(), t = Math.min(1, (now - t0)/SPIN_MS);
    const cur = startRot + total*bez(t), peg = Math.floor(cur/PEG);
    if(peg !== lastPeg){
      lastPeg = peg;
      if(now - lastTick > 45){ lastTick = now; SFX.tick(); flickPointer(); }
    }

const themeBtn = document.getElementById('themeBtn');
function applyTheme(day){ document.body.classList.toggle('day', day); themeBtn.textContent = day ? '🌙 夜晚' : '☀️ 白天'; }
try{ applyTheme(localStorage.getItem('walt-wheel-theme') === 'day'); }catch(e){}
themeBtn.addEventListener('click', ()=>{ const day = !document.body.classList.contains('day'); applyTheme(day); SFX.click();
  try{ localStorage.setItem('walt-wheel-theme', day ? 'day' : 'night'); }catch(e){} });
const fsBtn = document.getElementById('fsBtn');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
fsBtn.addEventListener('click', ()=>{
  try{
    const de = document.documentElement;
    if(!fsEl()){ const r = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); if(r && r.catch) r.catch(()=>{}); }
    else { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  }catch(e){}
});
function onFs(){ fsBtn.textContent = fsEl() ? '⛶ 退出全屏' : '⛶ 全屏'; setTimeout(fit, 200); }
document.addEventListener('fullscreenchange', onFs); document.addEventListener('webkitfullscreenchange', onFs);

/* ---------- 画面大小微调（希沃底部有工具栏挡住时用） ---------- */
function setZoom(z){
  userZoom = Math.max(.5, Math.min(1.2, Math.round(z*100)/100));
  try{ localStorage.setItem('walt-wheel-zoom', userZoom); }catch(e){}
  fit();
}
document.getElementById('zOut').addEventListener('click', e=>{ e.stopPropagation(); setZoom(userZoom - .05); });
document.getElementById('zIn').addEventListener('click', e=>{ e.stopPropagation(); setZoom(userZoom + .05); });

addEventListener('resize', fit);
addEventListener('orientationchange', ()=>setTimeout(fit, 300));
if(window.visualViewport) visualViewport.addEventListener('resize', fit);
if(window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
fit(); [100, 400, 1000, 2500].forEach(ms=>setTimeout(fit, ms));
</script>
</body>
</html>
